backend:
  name: github
  repo: dagdelenuk/postcodehub
  branch: main
  base_url: https://postcodehub.uk
  auth_endpoint: auth

# Uploaded images (if an editor chooses "upload" instead of pasting a URL in
# the image field) land in the repo here, and Astro serves public/ as-is.
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "banner_overrides"
    label: "Banner image overrides"
    files:
      - file: "data/manual/banner-overrides.json"
        label: "City & borough banner overrides"
        name: "banner-overrides"
        description: >
          Overrides the automatically-sourced Wikimedia photos for a
          city/borough's rotating banner. Add an entry with the exact page
          slug (e.g. "london", "richmond-upon-thames", "kensington-and-chelsea"
          - the part of the URL after postcodehub.uk/london/) to replace its
          banner images entirely.
        fields:
          - label: "Overrides"
            name: "overrides"
            widget: "list"
            summary: "{{fields.slug}}"
            fields:
              - { label: "Slug", name: "slug", widget: "string", hint: "e.g. london, richmond-upon-thames, kensington-and-chelsea" }
              - label: "Images"
                name: "images"
                widget: "list"
                fields:
                  - { label: "Image", name: "src", widget: "image", choose_url: true }
                  - { label: "Width (px)", name: "width", widget: "number", value_type: "int", default: 1600 }
                  - { label: "Height (px)", name: "height", widget: "number", value_type: "int", default: 900 }
                  - { label: "Credit text", name: "credit", widget: "string", hint: "Shown in the banner's corner, e.g. \"Jane Smith · CC BY 4.0 · Wikimedia Commons\"" }
                  - { label: "Credit link", name: "creditUrl", widget: "string", hint: "Where the credit text links to" }
                  - { label: "License", name: "license", widget: "string", hint: "e.g. CC BY 4.0, or \"All rights reserved (used with permission)\"" }

  - name: "geograph_overrides"
    label: "Geograph photo overrides"
    files:
      - file: "data/manual/geograph-overrides.json"
        label: "District/borough/city Geograph photo overrides"
        name: "geograph-overrides"
        description: >
          Corrects what fetch-district-images.ts picked automatically from
          geograph.org.uk for a district, borough or city slug (e.g. "tw11",
          "richmond-upon-thames", "london"). Find a photo's ID in its
          geograph.org.uk/photo/<id> URL, or browse the "District photos" /
          "Borough & city photos" collections below to see what's live now.
        fields:
          - label: "Overrides"
            name: "overrides"
            widget: "list"
            summary: "{{fields.slug}}"
            fields:
              - { label: "Slug", name: "slug", widget: "string", hint: "e.g. tw11, richmond-upon-thames, london" }
              - { label: "Include these photo IDs", name: "include", widget: "list", required: false, field: { label: "Photo ID", name: "id", widget: "string" } }
              - { label: "Exclude these photo IDs", name: "exclude", widget: "list", required: false, field: { label: "Photo ID", name: "id", widget: "string" } }
              - label: "Locked"
                name: "locked"
                widget: "boolean"
                default: false
                hint: >
                  When on, the next refresh leaves this slug's photos exactly
                  as they currently are instead of re-picking them - set this
                  once you're happy with a slug's Include/Exclude list above.

  - name: "district_photos"
    label: "District photos"
    description: >
      One entry per postcode district (e.g. tw11) - what's currently showing
      in its page's photo slider, auto-picked from geograph.org.uk by
      fetch-district-images.ts. Use the search box above the list to jump to
      a district. Click an image to preview it, or delete/reorder/swap one
      directly. To stop the next quarterly refresh from overwriting your
      edit, also tick "Locked" for this slug in "Geograph photo overrides".
    folder: "data/processed/district-images"
    extension: "json"
    format: "json"
    create: false
    delete: false
    identifier_field: "slug"
    slug: "{{fields.slug}}"
    summary: "{{fields.slug}}"
    fields:
      - { label: "Slug", name: "slug", widget: "string" }
      - label: "Images"
        name: "images"
        widget: "list"
        summary: "{{fields.credit}}"
        fields:
          - { label: "Image", name: "src", widget: "image", choose_url: true, hint: "R2-hosted, e.g. /images/geograph/tw11/8002714.webp" }
          - { label: "Width (px)", name: "width", widget: "number", value_type: "int" }
          - { label: "Height (px)", name: "height", widget: "number", value_type: "int" }
          - { label: "Credit text", name: "credit", widget: "string" }
          - { label: "Credit link (geograph.org.uk photo page)", name: "creditUrl", widget: "string" }
          - { label: "License", name: "license", widget: "string", default: "CC BY-SA 2.0" }

  - name: "place_photos"
    label: "Borough & city photos"
    description: >
      One entry per borough (e.g. richmond-upon-thames) plus "london" - what's
      currently showing in that page's photo slider, curated by
      curate-borough-images.ts from the borough's own districts (see
      "District photos" for those). Same editing as District photos: search,
      preview, delete/reorder/swap, then tick "Locked" in "Geograph photo
      overrides" for a slug you've hand-edited so the next refresh leaves it
      alone.
    folder: "data/processed/place-images"
    extension: "json"
    format: "json"
    create: false
    delete: false
    identifier_field: "slug"
    slug: "{{fields.slug}}"
    summary: "{{fields.slug}}"
    fields:
      - { label: "Slug", name: "slug", widget: "string" }
      - label: "Images"
        name: "images"
        widget: "list"
        summary: "{{fields.credit}}"
        fields:
          - { label: "Image", name: "src", widget: "image", choose_url: true, hint: "R2-hosted, e.g. /images/geograph/tw11/8002714.webp" }
          - { label: "Width (px)", name: "width", widget: "number", value_type: "int" }
          - { label: "Height (px)", name: "height", widget: "number", value_type: "int" }
          - { label: "Credit text", name: "credit", widget: "string" }
          - { label: "Credit link (geograph.org.uk photo page)", name: "creditUrl", widget: "string" }
          - { label: "License", name: "license", widget: "string", default: "CC BY-SA 2.0" }

  - name: "guides"
    label: "Guides"
    description: >
      Long-form editorial articles (school admissions, commute costs,
      comparing boroughs...) - shown at /guides/ and cross-linked as
      "Related guides" on relevant pages (matched by Topics below, e.g. a
      guide tagged "schools" appears on every borough's Schools page).
    folder: "src/content/guides"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text", hint: "Shown as the card blurb, the meta description, and in Related guides." }
      - { label: "Topics", name: "topics", widget: "list", hint: "e.g. schools, commute, budget - lowercase, matches what a page asks Related Guides for." }
      - { label: "Minutes to read", name: "minutesToRead", widget: "number", value_type: "int" }
      - { label: "Last reviewed", name: "lastReviewed", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - label: "Related PostcodeHub tools"
        name: "relatedTools"
        widget: "list"
        required: false
        fields:
          - { label: "Label", name: "label", widget: "string" }
          - { label: "Link", name: "href", widget: "string", hint: "e.g. /commute/, /compare/, /london/" }
      - { label: "Draft (hide from the site)", name: "draft", widget: "boolean", default: true }
      - { label: "Body", name: "body", widget: "markdown" }
