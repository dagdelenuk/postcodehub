backend:
  name: github
  repo: dagdelenuk/postcodehub
  branch: main
  base_url: https://postcodehub.uk
  auth_endpoint: auth

# Uploaded images (if an editor chooses "upload" instead of pasting a URL in
# the image field) land in the repo here, and Astro serves public/ as-is.
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "district_photos"
    label: "District photos"
    description: >
      One entry per postcode district (e.g. tw11) - what's currently showing
      in its page's photo slider, auto-picked from geograph.org.uk by
      fetch-district-images.ts. Use the search box above the list to jump to
      a district. Click an image to preview it, or delete/reorder/swap one -
      note the next quarterly refresh (fetch-district-images.ts) re-picks
      every district from scratch and will overwrite a hand edit here.
    folder: "data/processed/district-images"
    extension: "json"
    format: "json"
    create: false
    delete: false
    identifier_field: "slug"
    slug: "{{fields.slug}}"
    summary: "{{fields.slug}} — {{fields.photoCount}} photo(s)"
    sortable_fields: ["slug", "photoCount"]
    fields:
      - { label: "Slug", name: "slug", widget: "string" }
      - label: "Cover photo"
        name: "image"
        widget: "image"
        required: false
        hint: "Auto-set to the first photo below on the next refresh - shown here so the card/list view has a thumbnail."
      - { label: "Photo count", name: "photoCount", widget: "number", value_type: "int", required: false, hint: "Auto-set to the number of photos below on the next refresh." }
      - label: "Images"
        name: "images"
        widget: "list"
        summary: "{{fields.credit}}"
        fields:
          - { label: "Image", name: "src", widget: "image", choose_url: true, hint: "R2-hosted, e.g. /images/geograph/tw11/8002714.webp" }
          - { label: "Width (px)", name: "width", widget: "number", value_type: "int" }
          - { label: "Height (px)", name: "height", widget: "number", value_type: "int" }
          - { label: "Credit text", name: "credit", widget: "string" }
          - { label: "Credit link (geograph.org.uk photo page)", name: "creditUrl", widget: "string" }
          - { label: "License", name: "license", widget: "string", default: "CC BY-SA 2.0" }

  - name: "borough_photos"
    label: "Borough photos"
    description: >
      One entry per borough (e.g. richmond-upon-thames) - what's currently
      showing on that borough's page, curated by curate-borough-images.ts
      from its own districts (see "District photos" for those). Note the
      next quarterly refresh re-pools every borough from scratch and will
      overwrite a hand edit here.
    folder: "data/processed/borough-images"
    extension: "json"
    format: "json"
    create: false
    delete: false
    identifier_field: "slug"
    slug: "{{fields.slug}}"
    summary: "{{fields.slug}} — {{fields.photoCount}} photo(s)"
    sortable_fields: ["slug", "photoCount"]
    fields:
      - { label: "Slug", name: "slug", widget: "string" }
      - label: "Cover photo"
        name: "image"
        widget: "image"
        required: false
        hint: "Auto-set to the first photo below on the next refresh - shown here so the card/list view has a thumbnail."
      - { label: "Photo count", name: "photoCount", widget: "number", value_type: "int", required: false, hint: "Auto-set to the number of photos below on the next refresh." }
      - label: "Images"
        name: "images"
        widget: "list"
        summary: "{{fields.credit}}"
        fields:
          - { label: "Image", name: "src", widget: "image", choose_url: true, hint: "R2-hosted, e.g. /images/geograph/tw11/8002714.webp" }
          - { label: "Width (px)", name: "width", widget: "number", value_type: "int" }
          - { label: "Height (px)", name: "height", widget: "number", value_type: "int" }
          - { label: "Credit text", name: "credit", widget: "string" }
          - { label: "Credit link (geograph.org.uk photo page)", name: "creditUrl", widget: "string" }
          - { label: "License", name: "license", widget: "string", default: "CC BY-SA 2.0" }

  - name: "city_photos"
    label: "City photos"
    description: >
      One entry per city (currently just "london") - what's showing on the
      city page's photo slider. Unlike District/Borough photos, nothing
      auto-generates this - it's edited here only, so a hand edit always
      sticks.
    folder: "data/processed/city-images"
    extension: "json"
    format: "json"
    create: true
    delete: false
    identifier_field: "slug"
    slug: "{{fields.slug}}"
    summary: "{{fields.slug}} — {{fields.photoCount}} photo(s)"
    sortable_fields: ["slug", "photoCount"]
    fields:
      - { label: "Slug", name: "slug", widget: "string", hint: "e.g. london - the part of the URL after postcodehub.uk/" }
      - label: "Cover photo"
        name: "image"
        widget: "image"
        required: false
        hint: "Shown here so the card/list view has a thumbnail - keep this the same as the first photo below."
      - { label: "Photo count", name: "photoCount", widget: "number", value_type: "int", required: false }
      - label: "Images"
        name: "images"
        widget: "list"
        summary: "{{fields.credit}}"
        fields:
          - { label: "Image", name: "src", widget: "image", choose_url: true }
          - { label: "Width (px)", name: "width", widget: "number", value_type: "int", default: 1600 }
          - { label: "Height (px)", name: "height", widget: "number", value_type: "int", default: 900 }
          - { label: "Credit text", name: "credit", widget: "string" }
          - { label: "Credit link", name: "creditUrl", widget: "string" }
          - { label: "License", name: "license", widget: "string" }

  - name: "guides"
    label: "Guides"
    description: >
      Long-form editorial articles (school admissions, commute costs,
      comparing boroughs...) - shown at /guides/ and cross-linked as
      "Related guides" on relevant pages (matched by Topics below, e.g. a
      guide tagged "schools" appears on every borough's Schools page).
    folder: "src/content/guides"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Icon", name: "icon", widget: "string", hint: "One emoji, shown large and faded in the corner of the guide's card - e.g. 🩺, 💷, 🅿️." }
      - { label: "Description", name: "description", widget: "text", hint: "Shown as the card blurb, the meta description, and in Related guides." }
      - { label: "Topics", name: "topics", widget: "list", hint: "e.g. schools, commute, budget - lowercase, matches what a page asks Related Guides for." }
      - { label: "Minutes to read", name: "minutesToRead", widget: "number", value_type: "int" }
      - { label: "Last reviewed", name: "lastReviewed", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - label: "Related PostcodeHub tools"
        name: "relatedTools"
        widget: "list"
        required: false
        fields:
          - { label: "Label", name: "label", widget: "string" }
          - { label: "Link", name: "href", widget: "string", hint: "e.g. /commute/, /compare/, /london/ - used when the borough isn't known (see Borough-specific path below)." }
          - { label: "Borough-specific path (optional)", name: "boroughPath", widget: "string", required: false, hint: "e.g. \"schools/\" or \"statistics/\" - if the guide is reached from a specific borough's checklist, the link points there instead (e.g. /london/richmond-upon-thames/schools/)." }
      - { label: "Draft (hide from the site)", name: "draft", widget: "boolean", default: true }
      - { label: "Body", name: "body", widget: "markdown" }
